          vendor/bin/phpunit --filter 'RefCoreStoresDifferentialTest'
      - name: 'Small core helpers (ledger commit, v2 goal parser, intent revocation ids and exposure window, allocation caveat, share and revoke messages; shared reference corpus, a missing file fails)'
        if: ${{ !cancelled() }}
