          PCA_REQUIRE_PQ: ${{ matrix.os == 'ubuntu-26.04' && '1' || '0' }}
        run: |
          test -s test-data/ref-kem.json.gz
          vendor/bin/phpunit --filter 'RefKemDifferentialTest'
      - name: 'Entropy (QRNG sources over an injected transport, SP 800-90B health tests, HKDF mixing, secureSeed; shared reference corpus, a missing file fails)'
