          PCA_REQUIRE_PQ: ${{ matrix.os == 'ubuntu-26.04' && '1' || '0' }}
        run: |
          test -s test-data/ref-frost-net.json.gz
          vendor/bin/phpunit --filter 'RefFrostPqDifferentialTest'
      - name: 'Networked FROST allow token, equivocation guard and wire decoders (shared reference corpus, a missing file fails)'
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/ref-frost-net.json.gz
          vendor/bin/phpunit --filter 'RefFrostNetDifferentialTest'
      - name: 'Networked FROST signer proof of possession and nonce store (shared reference corpus, a missing file fails)'
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/ref-frost-net.json.gz
          vendor/bin/phpunit --filter 'RefFrostNetDifferentialTest'
      - name: 'Networked FROST signer service and coordinator (shared reference corpus, a missing file fails)'
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/ref-frost-net.json.gz
          vendor/bin/phpunit --filter 'RefFrostServiceDifferentialTest'
      - name: 'FROST distributed key generation (rounds, blame, echo agreement, codec, inbox, party driver) (shared reference corpus, a missing file fails)'
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/ref-frost-dkg.json.gz
          vendor/bin/phpunit --filter 'RefFrostDkgDifferentialTest'
      - name: 'Intent artifact, required-problem and classifier helpers (shared reference corpus, a missing file fails)'
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/ref-intent-misc2.json.gz
          vendor/bin/phpunit --filter 'RefIntentMisc2DifferentialTest'
      - name: 'Intent routing, conformance attestation and JIT scenarios (shared reference corpus, a missing file fails)'
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/ref-intent-routing.json.gz
          vendor/bin/phpunit --filter 'RefIntentRoutingDifferentialTest'
      - name: 'Base action schema and intent history corpora (shared reference corpus, a missing file fails)'
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/base-actionschema.json.gz
          test -s test-data/base-intenthistory.json.gz
          vendor/bin/phpunit --filter 'RefBase(ActionSchema|IntentHistory)DifferentialTest'
      - name: 'blue control protocol vs reference (shared reference corpus, a missing file fails)'
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/ref-control-blue.json.gz
          vendor/bin/phpunit --filter 'RefControlBlueDifferentialTest'
      - name: 'vendor attestation facades vs reference (shared reference corpus, a missing file fails)'
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/ref-attest-vendors.json.gz
          vendor/bin/phpunit --filter 'RefAttestVendorsDifferentialTest'
      - name: 'zk compliance (statements, the verifier gates, public-input derivation, quantizers, ceremony checks; shared reference corpus, a missing file fails; the pairing cases run in the Groth16 workflow)'
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/ref-zk.json.gz
          vendor/bin/phpunit --filter 'RefZkDifferentialTest'
      - name: Agent / issuer side (producer vectors byte for byte, round trips; a missing file fails)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        env:
          PCA_REQUIRE_PQ: ${{ matrix.os == 'ubuntu-26.04' && '1' || '0' }} # OpenSSL 3.5 over FFI: ML-DSA and SLH-DSA signing must work there
          PCA_PRODUCER_OUT: ${{ runner.temp }}/producer-native-php.json
        run: |
          vendor/bin/phpunit --filter 'AgentProducerTest|FacadeTest|SignersMoreTest|CatalogTest'
          [ "$PCA_REQUIRE_PQ" != 1 ] || test -s "$PCA_PRODUCER_OUT"  # written where post-quantum signing is required
      - name: Upload this SDK's signed artifacts for the reference verifier
        if: ${{ !cancelled() && matrix.os == 'ubuntu-26.04' && matrix.php == '8.4' }}
        uses: actions/upload-artifact@v4
        with:
          name: producer-native-php
          path: ${{ runner.temp }}/producer-native-php.json
          if-no-files-found: error
      - name: 'Provenance by default and undo windows (PHPUnit: vectors, mutation kills, the authorize gate, the undo admission hook)'
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        env:
          PCA_REQUIRE_PQ: ${{ matrix.os == 'ubuntu-26.04' && '1' || '0' }} # the hybrid provenance receipt test must run there
        run: vendor/bin/phpunit --filter 'ArgProvenance|Undo|ProvenanceFlow'
      - name: PHPUnit
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        # --exclude-group native-lib: the tests that need a natively built library run in the sandbox-wasm and lwe-ot workflows (which build it and require it)
        run: vendor/bin/phpunit --debug --exclude-group native-lib   # --debug names every test as it starts: a stuck test is visible in the log

  run-error-gate-control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The mutation run-error gate refuses a changed source line and an unlisted errored mutant
        run: node .github/scripts/run-error-gate-check.mjs

  laravel-example:
    name: Laravel example (POST /refunds behind protect())
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, json, mbstring, intl, gd, zip, openssl, gmp
          coverage: none
          tools: composer
      - name: Install
        working-directory: examples/laravel-server
        run: |
          for n in 1 2 3 4; do composer install --no-interaction --no-progress --prefer-dist && break; [ "$n" = 4 ] && exit 1; echo "composer attempt $n failed (network); retrying"; sleep $((n * 15)); done
      - name: Smoke test (a signed refund is allowed once, the replay and an unsigned call are refused with a doc link)
        working-directory: examples/laravel-server
        run: vendor/bin/phpunit
