      - name: 'Hybrid KEM (X25519 + ML-KEM-768 / -1024, X-Wing, FIPS 203 key checks; shared reference corpus, a missing file fails; must run where OpenSSL 3.5 is present)'
        if: ${{ !cancelled() }}
