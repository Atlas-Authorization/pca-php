name: CI

# The shared conformance corpus (conformance.php over conformance/vectors.json), the native-parity vector families
# (conformance-vectors.php: decision / escalation / model rules, caveat language v2, passport, vendor attestation evidence, Track 3, goal binding v3, staleness, operations, plans, assurance, K3 + fresh_at, provenance by default, undo windows) + the PHPUnit suites. ML-DSA comes from
# OpenSSL >= 3.5 libcrypto through FFI: ubuntu-26.04 and macOS have it; ubuntu-24.04 (OpenSSL 3.0) exercises the
# fail-closed path where the ML-DSA vectors must be skipped, never passed. The PHPUnit corpus suites locate the full
# adversarial set and the mutation-oracle inputs by the source layout, rebuilt from the flagship at the same ref.
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / PHP ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Where OpenSSL >= 3.5 is expected (ubuntu-26.04) a missing ML-DSA is a failure in EVERY PHPUnit step, never a skip.
    env:
      PCA_REQUIRE_PQ: ${{ matrix.os == 'ubuntu-26.04' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        php: ['8.1', '8.2', '8.3', '8.4']
        include:
          - { os: ubuntu-24.04, php: '8.3' }
          - { os: windows-latest, php: '8.3' }
          - { os: macos-latest, php: '8.3' }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, json, mbstring, intl, gd, zip, ffi, openssl, gmp, pdo_sqlite, sqlite3
          ini-values: ffi.enable=1
          coverage: none
          tools: composer
      - name: libyaml (the YAML authoring loader parses with libyaml over ext-ffi)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q libyaml-dev ;;
            macOS) brew install libyaml ;;
            Windows)
              vcpkg install libyaml:x64-windows
              echo "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"
              cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/yaml.dll" . 2>/dev/null || true ;;
          esac
      - name: Source layout (full adversarial corpus + mutation-oracle inputs from the flagship)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --mono php-pca $([ "$RUNNER_OS" = Windows ] || echo --less)
      - name: libsodium reachable for the Ed25519 core functions (over ext-ffi; needs libsodium >= 1.0.18; the OT tests skip, never pass, without it)
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          php -r 'require "src/Ed25519Core.php"; exit(Atlas\Pca\Ed25519Core::available() ? 0 : 1);' || echo "::warning::libsodium is not reachable over ext-ffi; the MPC OT tests will skip"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RSA DPoP oracle corpus (generated, never committed)
        shell: bash
        run: .github/scripts/dpop-rsa-corpus.sh "$(cd "$PCA_MONO_SDK" && pwd)/test-data/ref-dpop-rsa.json.gz"
      - name: Secret-key oracle corpora (generated, never committed)
        shell: bash
        run: .github/scripts/gen-secret-corpus.sh "$(cd "$PCA_MONO_SDK" && pwd)/test-data" oprf:oprf core-frost-swift:frost mpc-ot:mpc-ot attest-eat:attest-eat abe-go:abe frost-dkg:frost-dkg
      - name: Conformance corpus
        run: php conformance.php
      - name: Decision vectors (rules 20 and 21, ternary decision, signed escalation answers, model rules through authorize)
        if: ${{ !cancelled() }}
        run: php conformance-vectors.php decision escalation model-rules
      - name: Caveat language v2 vectors (shared caveat-lang-vectors.json; a missing file FAILS, never skips)
        if: ${{ !cancelled() }}
        run: php conformance-vectors.php caveat-lang
      - name: Forbid-wins certificate and linked policy template vectors (a missing file fails, never skips)
        if: ${{ !cancelled() }}
        run: php conformance-vectors.php policy-authoring
      - name: Passport vectors (every reason code, every suite, the hardware seam)
        if: ${{ !cancelled() }}
        run: php conformance-vectors.php passport
      - name: Attestation vectors (vendor evidence, strict X.509; a missing vector file FAILS)
        if: ${{ !cancelled() }}
        run: php conformance-vectors.php attestation passport-hardware
      - name: Track 3 vectors (intent state, ledger, optimistic, mesh)
        if: ${{ !cancelled() }}
        run: php conformance-vectors.php intent-state ledger optimistic mesh
      - name: Goal binding v3 vectors (approved_goal, commit, invalid, binding; a missing file FAILS)
        if: ${{ !cancelled() }}
        run: php conformance-vectors.php goal
      - name: Revocation staleness vectors (T9, max age, effective class, age, signed epoch, gate; a missing file FAILS)
        if: ${{ !cancelled() }}
        run: php conformance-vectors.php staleness
      - name: 'Operation records and plan lifecycle vectors (T3, T10: every scenario step, memory and database stores; a missing file FAILS)'
        if: ${{ !cancelled() }}
        run: php conformance-vectors.php operations plans
      - name: 'Assurance vectors (T8, B7: signature level, report, requirement gate, multi-root; a missing file FAILS)'
        if: ${{ !cancelled() }}
        run: php conformance-vectors.php assurance
      - name: K3 vectors (signed bundles, decision log, list receipts, grant management) and the fresh_at member
        if: ${{ !cancelled() }}
        run: php conformance-vectors.php k3 fresh-at pca-grant blueprint a2a k4 workflow readside vault-aggregate authorize-workflow lease obligations break-glass missing-context policy-classes provenance sigstore
      - name: 'Provenance by default and undo window vectors (arg-provenance, undo: every section; a missing file FAILS)'
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          test -s conformance/arg-provenance-vectors.json
          test -s conformance/undo-vectors.json
          php conformance-vectors.php arg-provenance undo
      - name: 'actions-vectors (action kit: ActionDef parse, canonical digest, trait expansion, floor check, pack proof, v2 schema formats; a missing vector directory FAILS)'
        if: ${{ !cancelled() }}
        run: php conformance-actions.php
      - name: Install
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          # theodo-group/llphant (and its openai-php/client ^0.19) need PHP 8.2+; the adapter is exercised on 8.2 and later
          [ "${{ matrix.php }}" = 8.1 ] && composer remove --dev theodo-group/llphant --no-update --no-interaction
          for n in 1 2 3 4; do composer install --no-interaction --no-progress --prefer-dist && break; [ "$n" = 4 ] && exit 1; echo "composer attempt $n failed (network); retrying"; sleep $((n * 15)); done
      - name: 'Post-quantum backend probe (OpenSSL version, ext-ffi, libcrypto candidates, the lane ML-DSA probe; fails fast where PCA_REQUIRE_PQ=1)'
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          openssl version || true
          # the lane's loader probes fixed system paths; also hand it whatever ldconfig reports, so a relocated libcrypto.so.3 is still found
          sys="$(ldconfig -p 2>/dev/null | awk '/libcrypto\.so\.3 /{print $NF; exit}' || true)"
          if [ -n "$sys" ]; then echo "ATLAS_PCA_LIBCRYPTO=$sys" >> "$GITHUB_ENV"; export ATLAS_PCA_LIBCRYPTO="$sys"; fi
          php "$GITHUB_WORKSPACE/.github/scripts/pq-probe.php"
      - name: 'Operation records, executor and plan lifecycle (PHPUnit: vectors, N processes on one database, store failures)'
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: vendor/bin/phpunit --filter 'OperationsTest|PlanLifecycleTest|RevocationStalenessTest|GoalCommitV3Test|AssuranceTest|MiddlewareOptionsTest|VerifierHooksTest|StepUpTest|StoreConformanceTest'
      - name: 'LLPhant adapter against the real library (theodo-group/llphant from require-dev: a FunctionInfo round trip through the tool proxy)'
        if: ${{ !cancelled() && matrix.php != '8.1' }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: vendor/bin/phpunit --filter 'LlPhantRealTest|LlPhantPcaToolProxyTest'
      - name: 'OpenAI adapters against the real library (openai-php/client from require-dev: a real tool call through ToolDispatch and the agents guard) and the agents adapter replay'
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: vendor/bin/phpunit --filter 'OpenAiPhpRealTest|OpenAiToolDispatchTest|RefOpenAiAgentsDifferentialTest'
      - name: 'Agent-native surface (caution, rationale, tool-schema firewall, envelope introspection, leases; shared reference corpus, a missing file fails)'
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/ref-agent-native.json.gz
          vendor/bin/phpunit --filter 'RefAgentNativeDifferentialTest'
      - name: 'Durable stores (ledger store, stored ledger, bond store, budget ledger, mesh witness; shared reference corpus, a missing file fails)'
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
