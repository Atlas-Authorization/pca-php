    steps:
      - uses: actions/checkout@v4
      - name: OpenSSL 3.5 (cached)
        id: ossl
        uses: actions/cache@v4
        with:
          path: /opt/openssl35
          key: openssl-3.5.9-ubuntu-24.04
      - name: Build OpenSSL 3.5
        if: steps.ossl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz | tar xz
          cd openssl-3.5.9 && ./Configure --prefix=/opt/openssl35 --libdir=lib shared no-tests > /dev/null
          make -j4 > /dev/null && sudo make install_sw > /dev/null
          LD_LIBRARY_PATH=/opt/openssl35/lib /opt/openssl35/bin/openssl version
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, json, mbstring, intl, gd, zip, ffi, openssl, gmp
          ini-values: ffi.enable=true
          coverage: pcov
          tools: composer
      # pcov.enabled=1 replaces the engine's executor with PCOV's own loop, which sends every opcode through its trace hook even
      # while nothing is collected: every PHPUnit process of the job ran 2-4x slower (the analyzer grid cases, 46 s / 27 s in the
      # CI job, passed the 100 s deadline in the baseline). PCOV stays loaded but off; only the runs that collect coverage (each
      # Infection initial run, --initial-tests-php-options below) turn it on, so the baseline and every mutant run without it.
      - name: PCOV loaded but off outside coverage runs
        run: |
          # setup-php writes pcov.enabled=1 into php.ini itself, which a scan-directory file does not reliably override: turn it off where it is set
          for f in $(php -r 'echo php_ini_loaded_file(), ",", php_ini_scanned_files();' | tr ',' '\n' | sed 's/^ *//' | grep .); do
            sudo sed -i -E 's/^[[:space:]]*pcov\.enabled[[:space:]]*=.*/pcov.enabled=0/' "$f"
          done
          [ "$(php -r 'echo extension_loaded("pcov") ? (int)ini_get("pcov.enabled") : "missing";')" = 0 ] || { echo "::error::PCOV is not loaded-and-off"; exit 1; }
          [ "$(php -d pcov.enabled=1 -r 'echo (int)ini_get("pcov.enabled");')" = 1 ] || { echo "::error::-d pcov.enabled=1 does not turn PCOV on"; exit 1; }
      - name: libyaml (the YAML authoring loader parses with libyaml over ext-ffi)
        run: sudo apt-get update -q && sudo apt-get install -y -q libyaml-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling + source layout (+ libatlas_less -> ATLAS_PCA_LIBLESS, so the LESS branches are tested)
        env:
          LESS: '1'
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - name: blst + the GT shim (pairing module; same build as the pairing workflow)
        if: ${{ matrix.native == 'pairing' }}
        run: |
          git clone --quiet --depth 1 --branch "$BLST_TAG" https://github.com/supranational/blst "$RUNNER_TEMP/blst"
          test "$(git -C "$RUNNER_TEMP/blst" rev-parse HEAD)" = "$BLST_COMMIT"
          D="$MONO/sdks/php-pca/native"; mkdir -p "$D/build"
          cc -O2 -fPIC -shared -D__BLST_PORTABLE__ -I"$RUNNER_TEMP/blst/bindings" \
            -o "$D/build/libblst.so" \
            "$D/pca_gt.c" "$RUNNER_TEMP/blst/src/server.c" "$RUNNER_TEMP/blst/build/assembly.S"
          echo "PCA_BLST_LIB=$D/build/libblst.so" >> "$GITHUB_ENV"
      - name: node-seal reference corpus + libsealc (FHE module; same build as the FHE workflow)
        if: ${{ matrix.native == 'fhe' }}
        run: |
          .github/scripts/fhe-seal-corpus.sh "$RUNNER_TEMP/fhe-seal.json.gz" "$MONO/tools/pca-audit/oracles/fhe-seal.mts"
          echo "ATLAS_PCA_LIBSEALC=$(.github/scripts/build-libsealc.sh "$SEAL_TAG" "$RUNNER_TEMP/seal")/libsealc.so" >> "$GITHUB_ENV"
          echo "PCA_FHE_SEAL_CORPUS=$RUNNER_TEMP/fhe-seal.json.gz" >> "$GITHUB_ENV"
          echo "PCA_FHE_SEAL_REQUIRED=1" >> "$GITHUB_ENV"
      - name: liblweot (endemic OT module; same build as the lwe-ot workflow)
        if: ${{ matrix.native == 'lwe-ot' }}
        run: |
          echo "ATLAS_PCA_LIBLWEOT=$(.github/scripts/build-liblweot.sh "$RUNNER_TEMP/lweot" "$MONO/packages/pca-mpc-lwe-ot-wasm/crate" | tail -1)/liblweot.so" >> "$GITHUB_ENV"
          echo "ATLAS_PCA_LIBLWEOT_REQUIRED=1" >> "$GITHUB_ENV"
      - name: wasmtime host (built once by the host job; the whole suite runs in every shard's baseline)
        uses: actions/download-artifact@v4
        with:
          name: wasmtime-host
          path: ${{ runner.temp }}/host-out
      - name: Export the host pin
        run: |
          chmod +x "$RUNNER_TEMP/host-out/pca-wasmtime-host"
          { echo "PCA_WASMTIME_HOST_BIN=$RUNNER_TEMP/host-out/pca-wasmtime-host"; echo "PCA_WASMTIME_HOST_SHA256=$(cat "$RUNNER_TEMP/host-out/host.sha256")"; } >> "$GITHUB_ENV"
      - name: libpcazk (Groth16 module; same build as the zk workflow)
        if: ${{ matrix.native == 'zk' }}
        run: |
          echo "ATLAS_PCA_LIBPCAZK=$(.github/scripts/build-libpcazk.sh "$RUNNER_TEMP/pcazk" "$MONO/packages/pca-zk/crate" | tail -1)/libpcazk.so" >> "$GITHUB_ENV"
          echo "ATLAS_PCA_LIBPCAZK_REQUIRED=1" >> "$GITHUB_ENV"
      - name: libfndsa (FN-DSA module; same build as the FN-DSA workflow)
        if: ${{ matrix.native == 'fndsa' }}
        run: |
          echo "ATLAS_PCA_LIBFNDSA=$(.github/scripts/build-libfndsa.sh "$RUNNER_TEMP/fndsa" "$MONO/packages/pca-fndsa-wasm/crate" | tail -1)/libfndsa.so" >> "$GITHUB_ENV"
          echo "ATLAS_PCA_LIBFNDSA_REQUIRED=1" >> "$GITHUB_ENV"
      - name: RSA DPoP oracle corpus (generated, never committed)
        run: .github/scripts/dpop-rsa-corpus.sh "$MONO/sdks/php-pca/test-data/ref-dpop-rsa.json.gz"
      - name: Oracle cases that carry private keys (generated, never committed)
        run: .github/scripts/gen-secret-corpus.sh "$MONO/sdks/php-pca/test-data" oprf:oprf core-frost-swift:frost mpc-ot:mpc-ot attest-eat:attest-eat abe-go:abe frost-dkg:frost-dkg
      - name: Coverage of this environment (from the coverage job - the unmutated oracle, green, per-test coverage + JUnit times)
        uses: actions/download-artifact@v4
        with:
          name: coverage-${{ matrix.native || 'base' }}
          path: ${{ runner.temp }}/coverage
      - name: Baseline (targeted mode)
        # a sliced shard always mutates its whole slice (its baseline holds only the slice)
        if: ${{ !(inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]')) && !matrix.slice }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ inputs.baseline_run }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/baseline-in"
          ids="$BASELINE"
          if [ -z "$ids" ]; then
            ids="$(gh run list -R "$GITHUB_REPOSITORY" --workflow mutation.yml --branch "$GITHUB_REF_NAME" --limit 20 \
                     --json databaseId -q '.[].databaseId' | grep -vx "$GITHUB_RUN_ID" || true)"
          fi
          for id in $ids; do
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n "infection-baseline-$SHARD" -D "$RUNNER_TEMP/baseline-in" 2>/dev/null \
               && [ -s "$RUNNER_TEMP/baseline-in/infection-baseline.json" ]; then
              echo "INFECTION_BASELINE=$RUNNER_TEMP/baseline-in/infection-baseline.json" >> "$GITHUB_ENV"
              echo "targeted: shard $SHARD seeded from run $id"; exit 0
            fi
          done
          echo "::notice::shard $SHARD: no baseline found, full run (seeds the baseline for the next run)"
      - name: Mutate
        working-directory: ${{ env.MONO }}/sdks/php-pca
        env:
          FILES: ${{ matrix.files }}
          SLICE: ${{ matrix.slice }}
          FULL: ${{ (inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]')) }}
        run: |
          # a full run (and a sliced shard) carries NOTHING from any baseline: no baseline is loaded, and none may be set here
          if [ "$FULL" = true ] && [ -n "${INFECTION_BASELINE:-}" ]; then echo "::error::full run with a baseline set"; exit 1; fi
          # every file of src/, subdirectories included, belongs to a shard of the matrix above and nothing else is listed
          diff <(find src -name '*.php' | sort) <(grep -E '^ +- \{ shard:' "$GITHUB_WORKSPACE/.github/workflows/mutation.yml" | cut -d"'" -f2 | tr ',' '\n' | sort -u)
          # the same vendor tree as the coverage job (Infection + its patches); no baseline run here: the coverage job ran the
          # unmutated oracle green in this same environment, and Infection mutates against that run (--skip-initial-tests)
          "$GITHUB_WORKSPACE/.github/scripts/infection-setup.sh"
          # 4 runner vCPUs, 4 mutant processes; each runs only its covering test cases (--only-covering-test-cases)
          INF=(vendor/bin/infection --coverage="$RUNNER_TEMP/coverage" --skip-initial-tests --only-covering-test-cases --threads=4 --no-progress --min-msi=0 --min-covered-msi=0)
          # a mutant that lets a forked child escape (StoreConformance race) must hit a process cap, not take the runner down
          # (shard 13 lost its runner twice at ~60 min): at most 1000 more processes for this user under Infection
          ulimit -u $(( $(ps -u "$(id -u)" --no-headers | wc -l) + 1000 ))
          if [ -n "${SLICE:-}" ]; then
            # mutate only the lines of slice k/n of the one file: a throwaway git base in which exactly those lines differ
            # (a trailing comment), then --git-diff-lines; cuts fall on method-closing lines ("    }"), so no node spans two slices
            mkdir -p "$RUNNER_TEMP/git-base"
            python3 "$GITHUB_WORKSPACE/.github/scripts/infection-slice.py" "$FILES" "$SLICE" "$RUNNER_TEMP/git-base"
            cp -R src "$RUNNER_TEMP/src-current"
            cp -R "$RUNNER_TEMP"/git-base/. src/
            git init -q . && git add src && git -c user.name=ci -c user.email=ci@localhost commit -qm "slice base"
            cp -R "$RUNNER_TEMP"/src-current/. src/
            set -o pipefail; "${INF[@]}" --git-diff-lines --git-diff-base=HEAD 2>&1 | tee "$RUNNER_TEMP/infection.out" | tail -25 || { grep -aE "Exception|Error:|deadline|memory|Fatal" "$RUNNER_TEMP/infection.out" | head -20; exit 1; }
            exit 0
          fi
          if [ -z "${INFECTION_BASELINE:-}" ]; then
            set -o pipefail; "${INF[@]}" --filter="$FILES" 2>&1 | tee "$RUNNER_TEMP/infection.out" | tail -25 || { grep -aE "Exception|Error:|deadline|memory|Fatal" "$RUNNER_TEMP/infection.out" | head -20; exit 1; }
            exit 0
          fi
          T="$GITHUB_WORKSPACE/.github/scripts/infection-targeted.py"
          n="$(python3 "$T" plan --baseline "$INFECTION_BASELINE" --src src --files "$FILES" --base-dir "$RUNNER_TEMP/git-base" \
                 --carried "$RUNNER_TEMP/carried.json")"
          echo "targeted: $n target line(s)"
          [ "$n" -gt 0 ] || exit 0
          # a throwaway git base in which exactly the target lines differ: --git-diff-lines then mutates only those
          cp -R src "$RUNNER_TEMP/src-current"
          cp -R "$RUNNER_TEMP"/git-base/. src/
          git init -q . && git add src && git -c user.name=ci -c user.email=ci@localhost commit -qm "infection base"
          cp -R "$RUNNER_TEMP"/src-current/. src/
          git diff --stat HEAD -- src
          set -o pipefail; "${INF[@]}" --git-diff-lines --git-diff-base=HEAD 2>&1 | tee "$RUNNER_TEMP/infection.out" | tail -25 || { grep -aE "Exception|Error:|deadline|memory|Fatal" "$RUNNER_TEMP/infection.out" | head -20; exit 1; }
      - name: Re-run timed-out mutants at twice the timeout
        working-directory: ${{ env.MONO }}/sdks/php-pca
        run: |
          # a timeout is not a kill: each timed-out mutant runs once more at twice the limit, and only a second timeout counts
          # (then the run-error gate needs a proof that the mutant itself never finishes)
          [ -f infection-out/log.json ] || exit 0
          R="$GITHUB_WORKSPACE/.github/scripts/infection-retime.py"
          n="$(python3 "$R" plan --log infection-out/log.json --src src --base-dir "$RUNNER_TEMP/retime-base" --config infection.json5)"
          echo "retime: $n line(s) with a timed-out mutant"
          [ "$n" -gt 0 ] || exit 0
          ulimit -u $(( $(ps -u "$(id -u)" --no-headers | wc -l) + 1000 ))
          rm -rf "$RUNNER_TEMP/retime-current" && cp -R src "$RUNNER_TEMP/retime-current"
          cp -R "$RUNNER_TEMP"/retime-base/. src/
          git init -q . && git add src && git -c user.name=ci -c user.email=ci@localhost commit -qm "retime base"
          cp -R "$RUNNER_TEMP"/retime-current/. src/
          set -o pipefail; vendor/bin/infection --coverage="$RUNNER_TEMP/coverage" --skip-initial-tests --only-covering-test-cases --configuration=infection.retime.json5 --threads=4 --no-progress --min-msi=0 --min-covered-msi=0 \
            --git-diff-lines --git-diff-base=HEAD 2>&1 | tee "$RUNNER_TEMP/infection.out" | tail -25 || { grep -aE "Exception|Error:|deadline|memory|Fatal" "$RUNNER_TEMP/infection.out" | head -20; exit 1; }
          python3 "$R" merge --log infection-out/log.json --retime infection-out/retime-log.json
      - name: Re-run every errored or timed-out mutant alone
        working-directory: ${{ env.MONO }}/sdks/php-pca
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # A dead PHPUnit process (memory fatal, killed) or a timeout is not a kill. Each such mutant gets ONE solo pass: one thread
          # (one mutant, one PHPUnit process), memory_limit raised to 4096M with the guard's watchdog trigger at 3000 MB (tests/bootstrap.php,
          # PCA_TEST_MEMORY_MB) and its deadline (PCA_TEST_DEADLINE), and a hard wall-clock limit on the whole process group. The solo result
          # decides: killed (a test failed, a guard throw included), survived (the ledger applies), or dead again (it needs a proof).
          # infection-out/solo-report.json keeps both results of every re-run mutant (uploaded per shard).
          echo '[]' > "$GITHUB_WORKSPACE/solo-report-$SHARD.json"
          [ -f infection-out/log.json ] || exit 0
          S="$GITHUB_WORKSPACE/.github/scripts/infection-solo.py"
          n="$(python3 "$S" plan --log infection-out/log.json --src src --base-dir "$RUNNER_TEMP/solo-base" --config infection.json5)"
          echo "solo: $n line(s) with an errored or timed-out mutant"
          [ "$n" -gt 0 ] || exit 0
          ulimit -u $(( $(ps -u "$(id -u)" --no-headers | wc -l) + 1000 ))
          sed -i 's|<ini name="memory_limit" value="[^"]*"/>|<ini name="memory_limit" value="4096M"/>|' phpunit.xml
          grep -q 'value="4096M"' phpunit.xml || { echo "::error::the memory_limit line of phpunit.xml was not found"; exit 1; }
          rm -rf "$RUNNER_TEMP/solo-current" && cp -R src "$RUNNER_TEMP/solo-current"
          cp -R "$RUNNER_TEMP"/solo-base/. src/
          git init -q . && git add src && git -c user.name=ci -c user.email=ci@localhost commit -q --allow-empty -m "solo base"
          cp -R "$RUNNER_TEMP"/solo-current/. src/
          export PCA_TEST_MEMORY_MB=3000
          setsid vendor/bin/infection --coverage="$RUNNER_TEMP/coverage" --skip-initial-tests --only-covering-test-cases --configuration=infection.solo.json5 --threads=1 --no-progress --min-msi=0 --min-covered-msi=0 \
            --git-diff-lines --git-diff-base=HEAD > "$RUNNER_TEMP/solo.out" 2>&1 &
          P=$!
          # inside the 60-minute job: the pass no longer re-runs the whole suite first, only the dead mutants
          ( sleep 1500; kill -TERM -- -$P 2>/dev/null; sleep 20; kill -KILL -- -$P 2>/dev/null ) &
          W=$!
          wait $P || true
          kill $W 2>/dev/null || true
          kill -KILL -- -$P 2>/dev/null || true
          tail -25 "$RUNNER_TEMP/solo.out"
          [ -f infection-out/solo-log.json ] || { echo "::error::the solo pass produced no log (it was killed at the wall-clock limit or failed to start)"; exit 1; }
          python3 "$S" merge --log infection-out/log.json --solo infection-out/solo-log.json --report infection-out/solo-report.json
          cp infection-out/solo-report.json "$GITHUB_WORKSPACE/solo-report-$SHARD.json"
      - name: Report
        env:
          FULL: ${{ (inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]')) }}
        run: |
          if [ "$FULL" = true ] && [ -e "$RUNNER_TEMP/carried.json" ]; then echo "::error::full run with carried mutants"; exit 1; fi
          D="$MONO/sdks/php-pca"; S="$D/infection-out/summary.json"
          A=(--src "$D/src" --files "${{ matrix.files }}" --summary "$S" --baseline infection-baseline.json --log "$D/infection-out/log.json")
          [ -f "$RUNNER_TEMP/carried.json" ] && A+=(--carried "$RUNNER_TEMP/carried.json")
          mkdir -p "$D/infection-out"
          python3 "$GITHUB_WORKSPACE/.github/scripts/infection-targeted.py" finish "${A[@]}"
          python3 "$MONO/tools/pca-audit/native-mutation/php-survivors.py" "$S" "$D/src" survivors.json run-errors-${{ matrix.shard }}.json
          node -e '
            const st = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).stats;
            const pick = ["killedCount", "escapedCount", "errorCount", "syntaxErrorCount", "skippedCount", "ignoredCount", "timeOutCount", "notCoveredCount"];
            const c = {}; for (const k of pick) if (st[k] !== undefined) c[k.replace(/Count$/, "")] = st[k];
            require("fs").writeFileSync("counts.json", JSON.stringify(c));
          ' "$S"
          node .github/scripts/mutation-shard-report.mjs --crate="$CRATE" --shard=${{ matrix.shard }} --of="$SHARDS" --tool=infection \
            --counts=counts.json --survivors=survivors.json --out=shard-${{ matrix.shard }}.json
          # measured cost per file (the next plan: mutation-cost.json); no log = a fully carried targeted shard
          [ -f "$D/infection-out/log.json" ] && python3 "$GITHUB_WORKSPACE/.github/scripts/infection-cost.py" --log "$D/infection-out/log.json" --shard ${{ matrix.shard }} --out cost-${{ matrix.shard }}.json || echo '{}' > cost-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            shard-${{ matrix.shard }}.json
            run-errors-${{ matrix.shard }}.json
            solo-report-${{ matrix.shard }}.json
            cost-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: infection-baseline-${{ matrix.shard }}
          path: infection-baseline.json
          retention-days: 30
      - name: Every mutant was run (none time-skipped)
        run: |
          # Infection does not run a mutant whose covering tests take longer than infection.json5 "timeout" and lists it nowhere
          # (only skippedCount): such a mutant is neither killed nor a survivor the ledger can see, so the shard fails.
          echo "timed out: $(node -p 'require("./counts.json").timeOut ?? 0'), errored (run errors, checked by the merge job): $(node -p 'require("./counts.json").error ?? 0')"
          n="$(node -p 'require("./counts.json").skipped ?? 0')"
          [ "$n" = 0 ] || { echo "::error::$n mutant(s) were time-skipped by Infection (never run): the no-time-skip patch (infection-patch.py) did not hold"; exit 1; }

  # Files whose Windows-only branches (PHP_OS_FAMILY === 'Windows': CreateFileW/DACL private files, SO_EXCLUSIVEADDRUSE listener, .dll/.exe
  # names, the libcrypto beside php.exe, TerminateProcess exit code) no Linux runner executes: they are mutated ON WINDOWS too, with only the
  # tests that reach them as the oracle. The merge counts a Linux survivor of these files only when it also survived here (mutation-merge.mjs).
  winshard:
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    needs: reuse
    name: windows shard ${{ matrix.n }} (${{ matrix.files }})
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # the Linux job's OpenSSL 3.5 pin does not exist here: the Windows oracle uses the libcrypto PHP ships
      PCA_REQUIRE_MLDSA: '0'
      ATLAS_PCA_LIBCRYPTO: ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { n: 1, files: 'src/PrivateFile.php', filter: 'PrivateFileTest|FrostDkgTlsTest' }
          - { n: 2, files: 'src/NativeDir.php', filter: 'NativeDirTest' }
          - { n: 3, files: 'src/ExclusiveListener.php', filter: 'ExclusiveListenerTest|FrostDkgTlsTest' }
          - { n: 4, files: 'src/OpensslEd448.php', filter: 'JoseEd448Pss256Test|CryptoSurvivorKill3OpensslEd448Test|RefOidcDifferentialTest|RefDpopDifferentialTest' }
          - { n: 5, files: 'src/SandboxWasmHost.php', filter: 'SandboxWasmHostTest', host: true }
          - { n: 6, files: 'src/StoreConformancePcaState.php', filter: 'StoreConformancePcaStateTest' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, json, mbstring, intl, gd, zip, ffi, openssl, gmp, sockets
          ini-values: ffi.enable=true
          coverage: pcov
          tools: composer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling + source layout
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - name: wasmtime host (sandbox shard only)
        if: ${{ matrix.host }}
        run: |
          out="$RUNNER_TEMP/host-out"
          .github/scripts/build-wasmtime-host.sh "$out" "$MONO/packages/pca-sandbox/wasmtime-host" >/dev/null
      - name: RSA DPoP oracle corpus (generated, never committed)
        run: .github/scripts/dpop-rsa-corpus.sh "$MONO/sdks/php-pca/test-data/ref-dpop-rsa.json.gz"
      - name: Oracle cases that carry private keys (generated, never committed)
        run: .github/scripts/gen-secret-corpus.sh "$MONO/sdks/php-pca/test-data" oprf:oprf core-frost-swift:frost mpc-ot:mpc-ot attest-eat:attest-eat abe-go:abe frost-dkg:frost-dkg
      - name: Mutate (the tests that reach the file only)
        working-directory: ${{ env.MONO }}/sdks/php-pca
        env:
          FILES: ${{ matrix.files }}
          FILTER: ${{ matrix.filter }}
        run: |
          for n in 1 2 3 4; do composer install --prefer-dist --no-interaction --no-progress -q && break; [ "$n" = 4 ] && exit 1; sleep $((n * 15)); done
          composer config --no-interaction allow-plugins.infection/extension-installer true
          for n in 1 2 3 4; do composer require --dev --no-interaction --no-progress -q -W "infection/infection:^0.29" && break; [ "$n" = 4 ] && exit 1; sleep $((n * 15)); done
          # the same method-range patch as the Linux shards
          P=vendor/infection/infection/src/TestFramework/Coverage/XmlReport/XmlCoverageParser.php
          grep -qF '$methodsCoverage[$methodName] = new SourceMethodLineRange(' "$P" || { echo "::error::the Infection method-range patch no longer applies ($P)"; exit 1; }
          sed -i 's/\$methodsCoverage\[\$methodName\] = new SourceMethodLineRange(/$methodsCoverage[] = new SourceMethodLineRange(/' "$P"
          # a mutant run needs a green baseline: the filtered oracle must pass on the unmutated source as Infection's initial run executes it
          # (PCOV coverage, random order); --debug names the last test prepared, so a process that dies mid-suite shows where
          php -d pcov.enabled=1 -d pcov.directory=. vendor/phpunit/phpunit/phpunit --filter "$FILTER" --order-by=random --debug \
            --coverage-xml "$RUNNER_TEMP/baseline-coverage/coverage-xml" --log-junit "$RUNNER_TEMP/baseline-coverage/junit.xml" \
            || { echo "::error::the Windows oracle ($FILTER) fails on the unmutated source under coverage in random order (exit $?)"; exit 1; }
          # Infection mutates against THAT green run's coverage and JUnit log: its own initial run of the same suite exited 1 after the
          # last test on Windows with no summary (shards 1 and 3, every round), while this identical run passes
          php vendor/bin/infection --threads=4 --no-progress --min-msi=0 --min-covered-msi=0 --filter="$FILES" \
            --coverage="$RUNNER_TEMP/baseline-coverage" --skip-initial-tests --test-framework-options="--filter=$FILTER"
      - name: Report
        run: |
          D="$MONO/sdks/php-pca"; S="$D/infection-out/summary.json"
          python "$GITHUB_WORKSPACE/.github/scripts/infection-targeted.py" finish --src "$D/src" --files "${{ matrix.files }}" --summary "$S" --baseline infection-baseline.json --log "$D/infection-out/log.json"
          python "$MONO/tools/pca-audit/native-mutation/php-survivors.py" "$S" "$D/src" survivors.json run-errors-win-${{ matrix.n }}.json
          node -e '
            const st = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).stats;
            const pick = ["killedCount", "escapedCount", "errorCount", "syntaxErrorCount", "skippedCount", "ignoredCount", "timeOutCount", "notCoveredCount"];
            const c = {}; for (const k of pick) if (st[k] !== undefined) c[k.replace(/Count$/, "")] = st[k];
            require("fs").writeFileSync("counts.json", JSON.stringify(c));
          ' "$S"
          node .github/scripts/mutation-shard-report.mjs --crate="$CRATE" --shard=${{ matrix.n }} --of="$SHARDS" --tool=infection \
            --counts=counts.json --survivors=survivors.json --scope="${{ matrix.files }}" --out=winshard-${{ matrix.n }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: winshard-${{ matrix.n }}
          path: winshard-${{ matrix.n }}.json
      - name: Every mutant was run (none time-skipped)
        run: |
          n="$(node -p 'require("./counts.json").skipped ?? 0')"
          [ "$n" = 0 ] || { echo "::error::$n mutant(s) were time-skipped by Infection (never run)"; exit 1; }

  merge:
    needs: [reuse, shard, winshard]
    if: ${{ needs.reuse.outputs.skip != 'true' && (always()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship checker + ledger
        run: .github/scripts/mutation-layout.sh "$CRATE"
      # only the reports and baselines: the coverage artifacts are large and not read here
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: reports
      - uses: actions/download-artifact@v4
        with:
          pattern: winshard-*
          path: reports
      - uses: actions/download-artifact@v4
        with:
          pattern: infection-baseline-*
          path: reports
      - name: Merge shards and check the ledger
        run: >
          node .github/scripts/mutation-merge.mjs --crate="$CRATE" --shards="$SHARDS" --reports=reports
          --checker="$MONO/tools/pca-audit" --src="$GITHUB_WORKSPACE"
      # gate honesty: every ERRORED mutant must be in mutation-run-errors.json with a per-mutant reason (scripts/run-error-gate.mjs).
      # The control proves the gate refuses what it must, in the same job, before its result is trusted.
      - name: Run errors (Infection errored mutants) are each listed with a reason
        if: ${{ !cancelled() }}
        run: |
          node .github/scripts/run-error-gate-check.mjs
          node .github/scripts/run-error-gate.mjs --reports=reports --ledger="$MONO/sdks/php-pca/mutation-run-errors.json" --src="$GITHUB_WORKSPACE" --shards="$SHARDS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survivors-merged
          path: reports/survivors-merged.json
          if-no-files-found: ignore

  reuse-record:
    name: reuse record
    needs: [reuse, coverage, shard, winshard, merge]
    # only a run whose jobs all passed (skipped by their own conditions is fine), that was not partial and not itself a reuse, leaves a record
    if: ${{ !cancelled() && needs.reuse.outputs.skip != 'true' && needs.reuse.outputs.hash != '' && !(false) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: rec
        env:
          GATE_FULL: ${{ inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]') }}
          HASH: ${{ needs.reuse.outputs.hash }}
        run: node .github/scripts/ci-reuse.mjs record --workflow=mutation --hash="$HASH" --out="$RUNNER_TEMP/reuse-record"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rec.outputs.artifact }}
          path: ${{ runner.temp }}/reuse-record/
          retention-days: 21
