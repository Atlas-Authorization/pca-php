          - { shard: 32, files: 'src/Attest/Amd.php,src/Attest/Maa.php,src/Attest/Gcp.php,src/Attest/PolicyLists.php' }
          # 0.5 hardening modules
          - { shard: 33, files: 'src/Prohibitions.php' }
