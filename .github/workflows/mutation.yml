name: Mutation

# Mutation testing of src/ with Infection (infection.json5: @default mutators, PHPUnit oracle incl. the full adversarial
# corpus and the mutation-oracle inputs), split into shards by source file. Survivors (escaped + uncovered) are converted
# with the flagship's tools/pca-audit/native-mutation/php-survivors.py and the merge job checks them against the
# equivalent-mutant ledger: it passes when every survivor is a ledgered equivalent and no ledger entry is stale. Runs on
# demand and on ci/** branches (the release-candidate check), never on main pushes. Runs on macOS: the PHPUnit oracle's
# ML-DSA library-discovery tests (MldsaDiscoveryTest, InjectionKillTest) assume the libcrypto set of the machines they were
# written on and fail on the Linux runner images, while the whole suite is green on macOS; a mutant run needs a green baseline.
#
# COVERAGE once per environment: the `coverage` job runs the unmutated oracle ONCE (PCOV per-test coverage + JUnit times; it is
# also the green baseline every mutant run needs), one job per native-library set, and every shard of that environment mutates
# against it (Infection --coverage --skip-initial-tests), running only the covering test cases of each mutant. Before, every shard
# ran the whole suite twice (a plain baseline + Infection's coverage run, ~40 min) and once more per re-run pass. Infection is
# patched (scripts/infection-patch.py): per-mutant process limit from its measured covering-test time, no mutant time-skipped.
#
# TARGETED mode (the default whenever a baseline exists): every shard uploads infection-baseline-<k> (its sources and every
# mutant with its result) and the next run starts from it. Infection mutates ONLY the target lines: the lines changed since
# the baseline and the lines of the baseline's survivors (escaped / not covered), selected with --git-diff-lines against a
# throwaway git base in which exactly those lines differ (scripts/infection-targeted.py). Every other baseline mutant is
# carried forward with its result, so each shard still reports its COMPLETE mutant set and the merge checks the ledger over
# the full picture. Baseline = the input `baseline_run`, else the newest earlier run of this workflow on the same branch
# that uploaded the shard's baseline; none (or `full: true`) = a full run, which seeds the baseline for the next one.
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: 'run id whose infection-baseline-<k> artifacts seed a targeted run (default: newest earlier run on this branch)'
        required: false
        default: ''
      full:
        description: 'ignore any baseline: mutate everything'
        type: boolean
        default: false
  push:
    branches: ['ci/**', '!ci/build-**']

permissions:
  contents: read
  actions: read   # download the baseline run's infection-baseline artifacts

concurrency:
  # a push supersedes an earlier push run; a dispatched (queue) run is never killed by a later push to the branch
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CRATE: php-pca
  # distro OpenSSL 3.0 (the fallback) + a cached OpenSSL 3.5 (the PQ path) side by side: every PQ / probe test runs, none skips
  PCA_REQUIRE_MLDSA: '1'
  ATLAS_PCA_LIBCRYPTO: /opt/openssl35/lib/libcrypto.so.3
  SHARDS: '218'
  BLST_TAG: v0.3.16
  BLST_COMMIT: e7f90de551e8df682f3cc99067d204d8b90d27ad
  SEAL_TAG: v4.1.2
  # each PHPUnit test gets this many seconds (tests/BaseDeadlineExtension.php): a mutant that makes a loop stop advancing fails the test instead of hanging the run
  PCA_TEST_DEADLINE: '100'

jobs:
  reuse:
    name: reuse check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
      hash: ${{ steps.reuse.outputs.hash }}
      source: ${{ steps.reuse.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      # input-hash reuse (ci-reuse.mjs): when an earlier run recorded the same input hash, every other job of this run is skipped.
      # continue-on-error: a failing check can only mean "no reuse"; FORCE_FULL / force_full / [force-full] bypass it.
      - id: reuse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ inputs.force_full || inputs.full || vars.FORCE_FULL == '1' || contains(github.event.head_commit.message, '[force-full]') }}
          GATE_FULL: ${{ inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]') }}
          PARTIAL: ${{ false }}
          EXTRA: ''
        run: node .github/scripts/ci-reuse.mjs check --workflow=mutation --self=.github/workflows/mutation.yml --external=flagship --extra="$EXTRA"
  # the reference wasmtime host, built once: tests/SandboxWasmHostTest FAILS under CI=true when PCA_WASMTIME_HOST_BIN/SHA256 are
  # missing, and every shard's unmutated baseline runs the whole suite
  host:
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    needs: reuse
    name: wasmtime host
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling + source layout
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - name: pca-wasmtime-host
        run: |
          out="$RUNNER_TEMP/host-out"
          .github/scripts/build-wasmtime-host.sh "$out" "$MONO/packages/pca-sandbox/wasmtime-host" >/dev/null
          sha256sum "$out/pca-wasmtime-host" | cut -d' ' -f1 > "$out/host.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wasmtime-host
          path: ${{ runner.temp }}/host-out/
          retention-days: 2
          if-no-files-found: error
  # The unmutated oracle with per-test coverage, once per environment (see the header): one per native-library set, since a native
  # module's tests run only where its library is built. Same setup steps as the shards, same vendor tree (infection-setup.sh).
  coverage:
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    needs: [reuse, host]
    name: coverage (${{ matrix.native || 'base' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        native: ['', pairing, fhe, lwe-ot, fndsa, zk]
    steps:
      - uses: actions/checkout@v4
      - name: OpenSSL 3.5 (cached)
        id: ossl
        uses: actions/cache@v4
        with:
          path: /opt/openssl35
          key: openssl-3.5.9-ubuntu-24.04
      - name: Build OpenSSL 3.5
        if: steps.ossl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz | tar xz
          cd openssl-3.5.9 && ./Configure --prefix=/opt/openssl35 --libdir=lib shared no-tests > /dev/null
          make -j4 > /dev/null && sudo make install_sw > /dev/null
          LD_LIBRARY_PATH=/opt/openssl35/lib /opt/openssl35/bin/openssl version
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, json, mbstring, intl, gd, zip, ffi, openssl, gmp
          ini-values: ffi.enable=true
          coverage: pcov
          tools: composer
      # pcov.enabled=1 replaces the engine's executor with PCOV's own loop, which sends every opcode through its trace hook even
      # while nothing is collected: every PHPUnit process of the job ran 2-4x slower (the analyzer grid cases, 46 s / 27 s in the
      # CI job, passed the 100 s deadline in the baseline). PCOV stays loaded but off; only the runs that collect coverage (each
      # Infection initial run, --initial-tests-php-options below) turn it on, so the baseline and every mutant run without it.
      - name: PCOV loaded but off outside coverage runs
        run: |
          # setup-php writes pcov.enabled=1 into php.ini itself, which a scan-directory file does not reliably override: turn it off where it is set
          for f in $(php -r 'echo php_ini_loaded_file(), ",", php_ini_scanned_files();' | tr ',' '\n' | sed 's/^ *//' | grep .); do
            sudo sed -i -E 's/^[[:space:]]*pcov\.enabled[[:space:]]*=.*/pcov.enabled=0/' "$f"
          done
          [ "$(php -r 'echo extension_loaded("pcov") ? (int)ini_get("pcov.enabled") : "missing";')" = 0 ] || { echo "::error::PCOV is not loaded-and-off"; exit 1; }
          [ "$(php -d pcov.enabled=1 -r 'echo (int)ini_get("pcov.enabled");')" = 1 ] || { echo "::error::-d pcov.enabled=1 does not turn PCOV on"; exit 1; }
      - name: libyaml (the YAML authoring loader parses with libyaml over ext-ffi)
        run: sudo apt-get update -q && sudo apt-get install -y -q libyaml-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling + source layout (+ libatlas_less -> ATLAS_PCA_LIBLESS, so the LESS branches are tested)
        env:
          LESS: '1'
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - name: blst + the GT shim (pairing module; same build as the pairing workflow)
        if: ${{ matrix.native == 'pairing' }}
        run: |
          git clone --quiet --depth 1 --branch "$BLST_TAG" https://github.com/supranational/blst "$RUNNER_TEMP/blst"
          test "$(git -C "$RUNNER_TEMP/blst" rev-parse HEAD)" = "$BLST_COMMIT"
          D="$MONO/sdks/php-pca/native"; mkdir -p "$D/build"
          cc -O2 -fPIC -shared -D__BLST_PORTABLE__ -I"$RUNNER_TEMP/blst/bindings" \
            -o "$D/build/libblst.so" \
            "$D/pca_gt.c" "$RUNNER_TEMP/blst/src/server.c" "$RUNNER_TEMP/blst/build/assembly.S"
          echo "PCA_BLST_LIB=$D/build/libblst.so" >> "$GITHUB_ENV"
      - name: node-seal reference corpus + libsealc (FHE module; same build as the FHE workflow)
        if: ${{ matrix.native == 'fhe' }}
        run: |
          .github/scripts/fhe-seal-corpus.sh "$RUNNER_TEMP/fhe-seal.json.gz" "$MONO/tools/pca-audit/oracles/fhe-seal.mts"
          echo "ATLAS_PCA_LIBSEALC=$(.github/scripts/build-libsealc.sh "$SEAL_TAG" "$RUNNER_TEMP/seal")/libsealc.so" >> "$GITHUB_ENV"
          echo "PCA_FHE_SEAL_CORPUS=$RUNNER_TEMP/fhe-seal.json.gz" >> "$GITHUB_ENV"
          echo "PCA_FHE_SEAL_REQUIRED=1" >> "$GITHUB_ENV"
      - name: liblweot (endemic OT module; same build as the lwe-ot workflow)
        if: ${{ matrix.native == 'lwe-ot' }}
        run: |
          echo "ATLAS_PCA_LIBLWEOT=$(.github/scripts/build-liblweot.sh "$RUNNER_TEMP/lweot" "$MONO/packages/pca-mpc-lwe-ot-wasm/crate" | tail -1)/liblweot.so" >> "$GITHUB_ENV"
          echo "ATLAS_PCA_LIBLWEOT_REQUIRED=1" >> "$GITHUB_ENV"
      - name: wasmtime host (built once by the host job; the whole suite runs in every shard's baseline)
        uses: actions/download-artifact@v4
        with:
          name: wasmtime-host
          path: ${{ runner.temp }}/host-out
      - name: Export the host pin
        run: |
          chmod +x "$RUNNER_TEMP/host-out/pca-wasmtime-host"
          { echo "PCA_WASMTIME_HOST_BIN=$RUNNER_TEMP/host-out/pca-wasmtime-host"; echo "PCA_WASMTIME_HOST_SHA256=$(cat "$RUNNER_TEMP/host-out/host.sha256")"; } >> "$GITHUB_ENV"
      - name: libpcazk (Groth16 module; same build as the zk workflow)
        if: ${{ matrix.native == 'zk' }}
        run: |
          echo "ATLAS_PCA_LIBPCAZK=$(.github/scripts/build-libpcazk.sh "$RUNNER_TEMP/pcazk" "$MONO/packages/pca-zk/crate" | tail -1)/libpcazk.so" >> "$GITHUB_ENV"
          echo "ATLAS_PCA_LIBPCAZK_REQUIRED=1" >> "$GITHUB_ENV"
      - name: libfndsa (FN-DSA module; same build as the FN-DSA workflow)
        if: ${{ matrix.native == 'fndsa' }}
        run: |
          echo "ATLAS_PCA_LIBFNDSA=$(.github/scripts/build-libfndsa.sh "$RUNNER_TEMP/fndsa" "$MONO/packages/pca-fndsa-wasm/crate" | tail -1)/libfndsa.so" >> "$GITHUB_ENV"
          echo "ATLAS_PCA_LIBFNDSA_REQUIRED=1" >> "$GITHUB_ENV"
      - name: RSA DPoP oracle corpus (generated, never committed)
        run: .github/scripts/dpop-rsa-corpus.sh "$MONO/sdks/php-pca/test-data/ref-dpop-rsa.json.gz"
      - name: Oracle cases that carry private keys (generated, never committed)
        run: .github/scripts/gen-secret-corpus.sh "$MONO/sdks/php-pca/test-data" oprf:oprf core-frost-swift:frost mpc-ot:mpc-ot attest-eat:attest-eat abe-go:abe frost-dkg:frost-dkg
      - name: The unmutated oracle under coverage (the green baseline of every shard of this environment)
        working-directory: ${{ env.MONO }}/sdks/php-pca
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/infection-setup.sh"
          C="$RUNNER_TEMP/coverage"
          # as Infection's own initial run: PCOV on over src/ only; --debug names the test a crash (segfault) died in
          php -d pcov.enabled=1 -d pcov.directory="$PWD/src" vendor/bin/phpunit --debug --coverage-xml "$C/coverage-xml" --log-junit "$C/junit.xml" > "$RUNNER_TEMP/baseline.log" || { echo "failed tests:"; grep -a -E '^Test (Failed|Errored|Skipped|Marked Incomplete|Considered Risky|Triggered (Warning|PHP Warning|Error))' -A3 "$RUNNER_TEMP/baseline.log" | cut -c1-300 | head -120; grep -avE '^Test (Prepared|Passed|Finished|Preparation Started|Preparation Finished|Triggered PHPUnit Deprecation)|^Assertion ' "$RUNNER_TEMP/baseline.log" | cut -c1-300 | tail -60; echo "last test started:"; grep -a -E '^Test Preparation Started' "$RUNNER_TEMP/baseline.log" | tail -1; echo "::error::the PHPUnit oracle fails on the unmutated source"; exit 1; }
          test -s "$C/coverage-xml/index.xml" && test -s "$C/junit.xml"
          du -sh "$C"
          # the slowest test classes (every mutant they cover pays them): the place to speed up the oracle
          python3 -I -c "import sys,xml.etree.ElementTree as E; s=[(float(x.get('time',0)),x.get('name')) for x in E.parse(sys.argv[1]).iter('testsuite') if x.get('file')]; print('\n'.join(f'{t:8.1f} s  {n}' for t,n in sorted(s,reverse=True)[:40]))" "$C/junit.xml"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.native || 'base' }}
          path: ${{ runner.temp }}/coverage/
          retention-days: 1
          if-no-files-found: error
  shard:
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    needs: [reuse, host, coverage]
    name: shard ${{ matrix.shard }}/218 (${{ matrix.files }}${{ matrix.slice && format(' {0}', matrix.slice) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # at most 60 shards at once, so the other languages' CI is not starved of org runners
      max-parallel: 24 # fair share: about 24 runners per PCA repo (10 repos, about 180 shared runners); one repo must never starve the rest
      matrix:
        include:
          # the opt-in native modules, each mutated with the same native library its own workflow builds (so their tests run instead
          # of skipping, and no mutant of these files is left uncovered): pairing (blst + the GT shim), FHE (libsealc + the node-seal
          # corpus), endemic LWE base OT (liblweot), FN-DSA (libfndsa), Groth16 (libpcazk). `native` selects the library steps and the coverage artifact.
          - { shard: 1, files: 'src/Aggsig.php,src/Bls12.php', native: pairing }
          - { shard: 2, files: 'src/Bbs.php,src/BbsCredential.php', native: pairing }
          - { shard: 3, files: 'src/Abe.php,src/AbePolicy.php,src/Fame.php', native: pairing }
          - { shard: 4, files: 'src/FheOrigin.php,src/FheSeal.php', native: fhe }
          - { shard: 5, files: 'src/MpcEndemicOt.php,src/MpcEndemicOtAbort.php,src/MpcLweLattice.php,src/MpcNetOt.php', native: lwe-ot }
          - { shard: 6, files: 'src/Fndsa.php,src/FndsaNative.php,src/FnDsaBackendMissing.php,src/FnDsaSuite.php', native: fndsa }
          - { shard: 7, files: 'src/Zk.php,src/ZkNative.php', native: zk }
          # files whose own code is plain PHP but some of whose mutants only a loaded native library can tell apart
          - { shard: 8, files: 'src/Agent.php', native: fndsa }
          # every other file of src/, packed by measured cost: scripts/mutation-plan.py + mutation-cost.json (the plan guard in the
          # Mutate step fails when one is missing)
          # BEGIN generated plan (scripts/mutation-plan.py)
          - { shard: 9, files: 'src/A2a.php,src/Gateway.php' }
          - { shard: 10, files: 'src/Acp.php,src/IntentClassifier.php' }
          - { shard: 11, files: 'src/ActionSchemaDraft.php,src/Ledger.php,src/MpcSpdz.php' }
          - { shard: 12, files: 'src/Actions.php', slice: '1/8' }
          - { shard: 13, files: 'src/Actions.php', slice: '2/8' }
          - { shard: 14, files: 'src/Actions.php', slice: '3/8' }
          - { shard: 15, files: 'src/Actions.php', slice: '4/8' }
          - { shard: 16, files: 'src/Actions.php', slice: '5/8' }
          - { shard: 17, files: 'src/Actions.php', slice: '6/8' }
          - { shard: 18, files: 'src/Actions.php', slice: '7/8' }
          - { shard: 19, files: 'src/Actions.php', slice: '8/8' }
          - { shard: 20, files: 'src/ActionsAuthor.php,src/ActionsEffective.php,src/ActionsSync.php,src/FrostNet.php' }
          - { shard: 21, files: 'src/ActionsBuild.php,src/Approval.php,src/Decision.php,src/OpensslMlKem.php,src/TxnTokens.php,src/YamlSeq.php' }
          - { shard: 22, files: 'src/ActionsBuiltin.php,src/ActionsEvolve.php,src/Attest/Xml.php,src/BondLedger.php,src/Compliance.php,src/IntentJit.php,src/IntentWitnesses.php,src/MpcNetPartyMain.php,src/NativeDir.php,src/PqThreshold.php,src/PrivateFile.php,src/SsfManage.php' }
          - { shard: 23, files: 'src/ActionsBuiltinData.php,src/ActionsTemplates.php,src/Analyzer.php,src/Attest/HardwareVerifier.php,src/Escalation.php,src/FalconBackend.php,src/GoalBinding.php,src/GoalDigests.php,src/GoalPrecedent.php,src/GuardedTool.php,src/IntentExtensions.php,src/IntentSessionStore.php,src/IntentSlots.php,src/InvariantsArbitraries.php,src/KvDoc.php,src/Laravel/PcaGuard.php,src/Laravel/PcaServiceProvider.php,src/ModelAdapter.php,src/ModelEnvConfig.php,src/ModelHttpResponse.php,src/MpcCompose.php,src/MpcEnc.php,src/MpcGf128.php,src/MpcMacCheckAbort.php,src/MpcNetClock.php,src/MpcOfflineProvider.php,src/MpcOtChannel.php,src/MpcOtRandom.php,src/MpcParty.php,src/MpcShake256.php,src/PcaCall.php,src/PolicyClasses.php,src/Protect.php,src/Rag.php,src/Refusals.php,src/Reputation.php,src/RuntimeClaim.php,src/SandboxWasmRelay.php,src/Session.php,src/StoreErrors.php,src/WalletPricing.php' }
          - { shard: 24, files: 'src/ActionsCompat.php,src/ActionsRender.php,src/Anthropic/ToolDispatch.php,src/Assurance.php,src/AttestEatProvenance.php,src/FrontierSignals.php,src/FrostDkgTls.php,src/GoalNormalize.php,src/GoalSign.php,src/IntentMap.php,src/IntentMetrics.php,src/Jsx.php,src/MpcNetCodec.php,src/OpenAi/ToolDispatch.php,src/OpensslEd448.php,src/PolicySim.php,src/PolicyTemplates.php,src/RevocationStaleness.php' }
          - { shard: 25, files: 'src/ActionsDerive.php,src/BudgetTree.php,src/GoalDrift.php,src/MpcSharing.php' }
          - { shard: 26, files: 'src/ActionsDiff.php,src/PcaMiddleware.php,src/PqQuorum.php' }
          - { shard: 27, files: 'src/ActionsHosted.php', slice: '1/2' }
          - { shard: 28, files: 'src/ActionsHosted.php', slice: '2/2' }
          - { shard: 29, files: 'src/ActionsImport.php,src/ActionsYaml.php,src/AttestEat.php,src/ObjectiveBinding.php' }
          - { shard: 30, files: 'src/ActionsImportGraphql.php,src/VerifyVerdict.php' }
          - { shard: 31, files: 'src/ActionsImportGrpc.php', slice: '1/4' }
          - { shard: 32, files: 'src/ActionsImportGrpc.php', slice: '2/4' }
          - { shard: 33, files: 'src/ActionsImportGrpc.php', slice: '3/4' }
          - { shard: 34, files: 'src/ActionsImportGrpc.php', slice: '4/4' }
          - { shard: 35, files: 'src/ActionsImportModel.php,src/ControlEvalsExample.php,src/IntentEffects.php,src/IntentHistory.php,src/IntentMapCommit.php,src/MpcNetGadget.php,src/ReadSide.php' }
          - { shard: 36, files: 'src/ActionsImportRulesData.php,src/GoalIrError.php,src/GoalOntologiesData.php,src/Mldsa.php,src/MpcMalOtAbort.php,src/MpcPointError.php' }
          - { shard: 37, files: 'src/ActionsImportSuggest.php,src/Sdjwt.php' }
          - { shard: 38, files: 'src/ActionsLint.php,src/Evidence.php,src/MpcNetLaunch.php,src/MpcNetWire.php' }
          - { shard: 39, files: 'src/ActionsPack.php,src/ActionsYamlLoad.php,src/GoalLegacy.php,src/Ha.php,src/PcaSchema.php,src/PqSoftware.php' }
          - { shard: 40, files: 'src/ActionsRegistry.php', slice: '1/4' }
          - { shard: 41, files: 'src/ActionsRegistry.php', slice: '2/4' }
          - { shard: 42, files: 'src/ActionsRegistry.php', slice: '3/4' }
          - { shard: 43, files: 'src/ActionsRegistry.php', slice: '4/4' }
          - { shard: 44, files: 'src/ActionsReview.php,src/ActionsTestRunner.php,src/AttestVendors.php,src/ForbidCertificate.php,src/FrostHttp.php,src/HybridThreshold.php,src/K4.php' }
          - { shard: 45, files: 'src/ActionsRules.php,src/Attest/PolicyLists.php,src/GoalFmt.php' }
          - { shard: 46, files: 'src/ActionsRulesValidate.php,src/Attest/Maa.php,src/BreakGlass.php' }
          - { shard: 47, files: 'src/ActionsSelector.php,src/ActionsTransparency.php,src/GoalPrecedentLog.php,src/MpcFieldRng.php,src/NlApproval.php,src/PqThresholdExperimental.php,src/ReadVault.php,src/WalletDelivery.php' }
          - { shard: 48, files: 'src/ActionsTemplatesData.php,src/Revoke.php,src/SafetyCertificate.php' }
          - { shard: 49, files: 'src/ActionsUndoEngine.php,src/Adapters.php,src/Events.php,src/Fetch.php,src/GoalDriftMonitor.php,src/IntentStatement.php,src/MpcKemOt.php' }
          - { shard: 50, files: 'src/AdaUrl.php,src/LedgerStore.php,src/Passport.php,src/StateStore.php' }
          - { shard: 51, files: 'src/AgentNative.php,src/MpcNetCerts.php' }
          - { shard: 52, files: 'src/Agentcard.php,src/MpcOtExtSender.php' }
          - { shard: 53, files: 'src/AnalyzerCore.php', slice: '1/7' }
          - { shard: 54, files: 'src/AnalyzerCore.php', slice: '2/7' }
          - { shard: 55, files: 'src/AnalyzerCore.php', slice: '3/7' }
          - { shard: 56, files: 'src/AnalyzerCore.php', slice: '4/7' }
          - { shard: 57, files: 'src/AnalyzerCore.php', slice: '5/7' }
          - { shard: 58, files: 'src/AnalyzerCore.php', slice: '6/7' }
          - { shard: 59, files: 'src/AnalyzerCore.php', slice: '7/7' }
