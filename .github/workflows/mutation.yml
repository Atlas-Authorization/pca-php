          # corpus), endemic LWE base OT (liblweot). `native` selects the library steps below.
          - { shard: 37, files: 'src/Aggsig.php,src/Bbs.php,src/BbsCredential.php,src/Bls12.php,src/Abe.php,src/AbePolicy.php,src/Fame.php', native: pairing }
